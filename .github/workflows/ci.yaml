name: ci

concurrency:
    group: ci
    cancel-in-progress: true

on:
    push:
    workflow_dispatch:

jobs:
    linter:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  extensions: json,zip
                  coverage: none
                  tools: composer:v2

            - name: Check PHP Version
              run: php -v

            - name: Install dependencies
              run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

            - name: Composer Validate
              run: composer validate --strict

            - name: Install PHPStan
              run: composer install --working-dir tools/phpstan --prefer-dist --no-progress --no-scripts --no-interaction

            - name: Run PHPStan
              run: tools/phpstan/vendor/bin/phpstan analyse -c phpstan.neon --ansi

            - name: Install PHP-CS-Fixer
              run: composer install --working-dir tools/php-cs-fixer --prefer-dist --no-progress --no-scripts --no-interaction

            - name: Run PHP-CS-Fixer
              run: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix -vvv --diff --dry-run --allow-risky=yes --ansi

    test:
        name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }} - ${{ matrix.stability }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                symfony: ['^7', '^8']
                stability: [prefer-lowest, prefer-stable]
                exclude:
                    # Symfony 8 requires PHP >= 8.4
                    - php: '8.3'
                      symfony: '^8'
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json,zip
                  coverage: none
                  tools: composer:v2

            - name: Check PHP Version
              run: php -v

            - name: Restrict Symfony version
              run: |
                  composer require --no-update "symfony/framework-bundle:${{ matrix.symfony }}" "symfony/uid:${{ matrix.symfony }}"
                  composer require --dev --no-update "symfony/serializer:${{ matrix.symfony }}"

            - name: Install dependencies
              run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress ${{ matrix.flags }}

            - name: Run Unit tests with coverage
              run: vendor/bin/phpunit --configuration ./phpunit.xml -- ${{ matrix.phpunit-flags }}
